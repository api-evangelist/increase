- aid: increase:increase-account-transfers-api
  name: Increase Account Transfers API
  description: >-
    Account transfers move funds between your own accounts at Increase (accounting systems often refer
    to these as Book Transfers). Account Transfers are free and synchronous. Upon creation they create
    two Transactions, one negative on the originating account and one positive on the destination account
    (unless the transfer requires approval, in which case the Transactions will be created when the transfer
    is approved).
  humanURL: https://increase.com/documentation/api
  baseURL: https://api.increase.com
