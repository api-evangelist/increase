apis:
- aid: increase:increase-account-numbers-api
  name: Increase Account Numbers API
  description: >-
    Each account can have multiple account and routing numbers. We recommend that you use a set per vendor.
    This is similar to how you use different passwords for different websites. Account numbers can also
    be used to seamlessly reconcile inbound payments. Generating a unique account number per vendor ensures
    you always know the originator of an incoming payment.
  humanURL: https://increase.com/documentation/api
  baseURL: https://api.increase.com
  tags:
